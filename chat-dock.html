<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чаты — Лента</title>
    <style>
        :root {
            color-scheme: dark;
            font: 14px/1.45 Inter, system-ui, sans-serif;
            background: #17191e;
            color: #f3f4f7;
            --muted: #aeb3bf;
            --line: #30343e;
            --twitch: #d3b4ff;
            --youtube: #ffa7ad;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; }
        main { display: flex; flex-direction: column; height: 100vh; min-height: 360px; }
        header { display: grid; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
        h1 { margin: 0; font-size: 18px; }
        #connection { margin: 0; color: var(--muted); font-size: 12px; }
        #connection[data-state="ready"] { color: #a1dab9; }
        #connection[data-state="error"] { color: #ffbf9f; }
        #filters, .analysis-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
        select, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #22252d;
            color: inherit;
            font: inherit;
            padding: 4px 8px;
        }
        textarea { resize: vertical; min-height: 58px; }
        #deepseek { border-top: 1px solid var(--line); padding: 10px 12px; }
        #analysis-config { margin: 8px 0; }
        #analysis-config summary { cursor: pointer; }
        #analysis-config label { display: block; margin: 8px 0 3px; color: var(--muted); }
        .analysis-buttons { margin-top: 8px; }
        #analysis-status, .analysis-meta { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
        #analysis-result { max-height: 125px; overflow: auto; overflow-wrap: anywhere; }
        #analysis-result p { margin: 6px 0; }
        #analysis-result ul { margin: 6px 0; padding-inline-start: 19px; }

        button {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #22252d;
            color: inherit;
            font: inherit;
            padding: 4px 10px;
            cursor: pointer;
        }

        button:hover { background: #303541; }
        button:disabled { opacity: .55; cursor: default; }
        button[aria-pressed="true"] { border-color: #a6b2d0; background: #353d52; }
        :focus-visible { outline: 2px solid #bacdff; outline-offset: -2px; }
        #feed { flex: 1; min-height: 120px; overflow-y: auto; overflow-anchor: none; }
        #empty { padding: 10px 12px; margin: 0; color: var(--muted); }
        #messages { list-style: none; padding: 0; margin: 0; }

        .message {
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            overflow-wrap: anywhere;
        }

        .message-info { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; }
        .platform { font-size: 11px; font-weight: 700; }
        .test-mark { color: #f5ce88; font-size: 11px; }
        [data-platform="twitch"] .platform { color: var(--twitch); }
        [data-platform="youtube"] .platform { color: var(--youtube); }
        time { margin-inline-start: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .message-text { margin: 2px 0 0; white-space: pre-wrap; }
        footer { padding: 6px 12px; border-top: 1px solid var(--line); }
        footer button { width: 100%; }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Чаты — Лента</h1>
        <p id="connection" role="status">Подключение к Streamer.bot…</p>
        <div id="filters" role="group" aria-label="Площадки">
            <button type="button" data-filter="all" aria-pressed="true">Все</button>
            <button type="button" data-filter="twitch" aria-pressed="false">Twitch</button>
            <button type="button" data-filter="youtube" aria-pressed="false">YouTube</button>
        </div>
    </header>
    <div id="feed" tabindex="0" role="region" aria-label="Сообщения чатов">
        <p id="empty">Сообщений пока нет</p>
        <ol id="messages" role="log" aria-label="Новые сообщения"></ol>
    </div>
    <footer id="latest" hidden>
        <button type="button">К последним сообщениям ↓</button>
    </footer>
    <section id="deepseek" aria-labelledby="deepseek-heading">
        <strong id="deepseek-heading">DeepSeek</strong>
        <details id="analysis-config">
            <summary>Настройки анализа</summary>
            <label for="analysis-scope">Анализировать</label>
            <select id="analysis-scope" disabled>
                <option value="all">Twitch и YouTube</option>
                <option value="twitch">Twitch</option>
                <option value="youtube">YouTube</option>
            </select>
            <label for="analysis-prompt">Промпт</label>
            <textarea id="analysis-prompt" rows="3" maxlength="2000" disabled></textarea>
            <div class="analysis-buttons">
                <button id="analysis-save" type="button" disabled>Сохранить</button>
            </div>
        </details>
        <div class="analysis-buttons">
            <button id="analysis-toggle" type="button" disabled>Запустить анализ</button>
            <button id="analysis-test" type="button" disabled title="Использует сохранённые настройки и расходует токены DeepSeek">Запустить тест</button>
        </div>
        <p id="analysis-status" role="status">Ожидаем Streamer.bot…</p>
        <div id="analysis-result" aria-live="polite"></div>
    </section>
</main>
<script>
    'use strict';

    const WS_URL = 'ws://127.0.0.1:8080/';
    const MESSAGE_LIMIT = 500;
    const RETRY_DELAY = 3000;
    const SUBSCRIBE_TIMEOUT = 5000;
    const ACTION = 'Чаты — Лента';
    const PLATFORMS = { twitch: 'Twitch', youtube: 'YouTube' };

    const connection = document.querySelector('#connection');
    const filters = document.querySelector('#filters');
    const feed = document.querySelector('#feed');
    const empty = document.querySelector('#empty');
    const messages = document.querySelector('#messages');
    const latest = document.querySelector('#latest');
    const timeFormat = new Intl.DateTimeFormat('ru-RU', { timeStyle: 'medium' });
    const messageIds = new Set();
    let filter = 'all';

    function atBottom() {
        return feed.scrollHeight - feed.clientHeight - feed.scrollTop <= 12;
    }

    function scrollToLatest() {
        feed.scrollTop = feed.scrollHeight;
        latest.hidden = true;
    }

    function updateEmpty() {
        empty.hidden = Boolean(messages.querySelector('li:not([hidden])'));
    }

    function appendMessage(message) {
        const key = message.id && [message.testRequest, message.platform, message.id].join(':');
        if (key && messageIds.has(key)) return;
        const follow = atBottom();

        const row = document.createElement('li');
        row.className = 'message';
        row.dataset.platform = message.platform;
        row.hidden = filter !== 'all' && filter !== message.platform;
        if (key) {
            row.dataset.key = key;
            messageIds.add(key);
        }

        const info = document.createElement('div');
        info.className = 'message-info';
        const platform = document.createElement('span');
        platform.className = 'platform';
        platform.textContent = PLATFORMS[message.platform];
        const author = document.createElement('strong');
        author.textContent = message.author;
        const time = document.createElement('time');
        time.dateTime = message.time.toISOString();
        time.textContent = timeFormat.format(message.time);
        info.append(platform, author);
        if (message.testRequest) {
            const mark = document.createElement('span');
            mark.className = 'test-mark';
            mark.textContent = 'Тест';
            info.append(mark);
        }
        info.append(time);

        const text = document.createElement('p');
        text.className = 'message-text';
        text.textContent = message.text;
        row.append(info, text);
        messages.append(row);

        if (messages.childElementCount > MESSAGE_LIMIT) {
            const oldest = messages.firstElementChild;
            const removedHeight = oldest.offsetHeight;
            messageIds.delete(oldest.dataset.key);
            oldest.remove();
            if (!follow) feed.scrollTop -= removedHeight;
        }

        updateEmpty();
        if (follow) scrollToLatest();
        else latest.hidden = atBottom();
    }

    filters.addEventListener('click', event => {
        const selected = event.target.closest('button[data-filter]');
        if (!selected || selected.dataset.filter === filter) return;
        filter = selected.dataset.filter;
        for (const button of filters.querySelectorAll('button')) {
            button.setAttribute('aria-pressed', String(button === selected));
        }
        for (const row of messages.children) {
            row.hidden = filter !== 'all' && filter !== row.dataset.platform;
        }
        updateEmpty();
        scrollToLatest();
    });

    feed.addEventListener('scroll', () => { latest.hidden = atBottom(); });
    latest.querySelector('button').addEventListener('click', () => {
        feed.focus({ preventScroll: true });
        scrollToLatest();
    });

    function setStatus(text, state) {
        connection.textContent = text;
        connection.dataset.state = state;
    }


    const analysisScope = document.querySelector('#analysis-scope');
    const analysisPrompt = document.querySelector('#analysis-prompt');
    const analysisToggle = document.querySelector('#analysis-toggle');
    const analysisSave = document.querySelector('#analysis-save');
    const analysisTest = document.querySelector('#analysis-test');
    const analysisStatus = document.querySelector('#analysis-status');
    const analysisResult = document.querySelector('#analysis-result');
    let socket;
    let subscribed = false;
    let actionId = '';
    let state = null;
    let dirty = false;
    let problem = '';
    let testNotice = '';
    let pendingCommand = null;
    let pendingTest = null;
    let lastResultSignature = '';
    let requestNumber = 0;

    function updateControls() {
        const ready = Boolean(state && actionId && subscribed && socket?.readyState === WebSocket.OPEN);
        const locked = !ready || Boolean(pendingCommand || pendingTest);
        analysisScope.disabled = locked;
        analysisPrompt.disabled = locked;
        analysisToggle.disabled = locked || (!state?.enabled && !analysisPrompt.value.trim());
        analysisSave.disabled = locked || !dirty || !analysisPrompt.value.trim();
        analysisTest.disabled = locked;
        analysisToggle.textContent = state?.enabled ? 'Пауза' : 'Запустить анализ';
        analysisStatus.textContent = problem || (pendingTest ? 'Тест: ожидаем таймер и ответ DeepSeek…'
            : pendingCommand ? 'Ожидаем ответ Streamer.bot…'
            : testNotice || state?.error || (state
                ? (state.enabled ? 'Анализ включён' : 'Анализ на паузе') + (state.dropped ? ' · Пропущено: ' + state.dropped : '')
                : 'Ожидаем настройки анализа…'));
    }

    function renderAnalysis(result, test = false) {
        analysisResult.replaceChildren();
        if (!result) return;

        const summary = document.createElement('p');
        summary.textContent = result.summary || 'В этой пачке нет новых выводов.';
        analysisResult.append(summary);
        if (Array.isArray(result.items) && result.items.length) {
            const list = document.createElement('ul');
            for (const item of result.items) {
                const row = document.createElement('li');
                const sources = (item.sources || []).map(source => source.platform + (source.author ? ' · ' + source.author : ''));
                row.textContent = item.text + (sources.length ? ' (' + sources.join(', ') + ')' : '');
                list.append(row);
            }
            analysisResult.append(list);
        }
        const meta = document.createElement('p');
        meta.className = 'analysis-meta';
        meta.textContent = (test ? 'Тест · ' : '') + 'Сообщений: ' + result.count +
            (Number.isInteger(result.tokens) ? ' · Токены: ' + result.tokens : '');
        analysisResult.append(meta);
    }

    function applyAnalysisState(data) {
        const command = pendingCommand?.id === data.request ? pendingCommand : null;
        if (data.request && !command) return;
        if (command) {
            clearTimeout(command.timer);
            pendingCommand = null;
            problem = data.commandError || '';
        }
        if (data.protocol !== 1) {
            state = null;
            problem = 'Обновите C# в Action «' + ACTION + '».';
            updateControls();
            return;
        }
        state = data;
        if (command && !problem && (command.name === 'start' || command.name === 'save')) dirty = false;
        if (!dirty) {
            analysisPrompt.value = data.prompt || '';
            analysisScope.value = data.scope || 'all';
        }
        const signature = JSON.stringify(data.result);
        if (signature !== lastResultSignature || data.event === 'chat_analysis_result') {
            lastResultSignature = signature;
            if (!pendingTest && (!testNotice || data.event === 'chat_analysis_result')) {
                if (data.event === 'chat_analysis_result') testNotice = '';
                renderAnalysis(data.result);
            }
        }
        updateControls();
    }

    function finishTest(data) {
        if (!pendingTest) return;
        clearTimeout(pendingTest.timer);
        pendingTest = null;
        testNotice = data.error || 'Тест завершён.';
        if (data.result) renderAnalysis(data.result, true);
        updateControls();
    }

    function receiveCustom(data) {
        if (data?.event === 'chat_message' && Object.hasOwn(PLATFORMS, data.platform) && typeof data.text === 'string') {
            const time = Date.parse(data.time);
            appendMessage({ ...data, author: data.author || 'Неизвестный автор', time: new Date(Number.isFinite(time) ? time : Date.now()) });
        } else if (data?.event === 'chat_analysis_result' && data.request) {
            if (data.request === pendingTest?.id) finishTest(data);
        } else if (data?.event === 'chat_analysis_state' || data?.event === 'chat_analysis_result') {
            applyAnalysisState(data);
        }
    }

    function send(payload) {
        socket.send(JSON.stringify(payload));
    }

    function requestAction(name) {
        const test = name === 'test';
        if (!actionId || !subscribed || socket?.readyState !== WebSocket.OPEN || pendingCommand || pendingTest) return;
        const id = 'nika-chat-' + Date.now() + '-' + (++requestNumber) + '-' + Math.random().toString(36).slice(2);
        problem = '';
        testNotice = '';
        const args = test
            ? { analysisCommand: 'test', analysisTestMode: 'timer', testRequest: id }
            : { analysisCommand: name, analysisRequest: id, analysisPrompt: analysisPrompt.value, analysisScope: analysisScope.value };
        const request = { id, name, timer: setTimeout(() => {
            if (test) finishTest({ error: 'Нет результата теста. Проверьте триггер Timed Actions и ключ DeepSeek.' });
            else {
                pendingCommand = null;
                problem = 'Action не вернул настройки анализа.';
                updateControls();
                if (name === 'state') socket?.close();
            }
        }, test ? 85000 : 6000) };
        if (test) {
            pendingTest = request;
            renderAnalysis(null);
        } else pendingCommand = request;
        try {
            send({ request: 'DoAction', id, action: { id: actionId }, args });
        } catch {
            socket.close();
        }
        updateControls();
    }

    for (const field of [analysisPrompt, analysisScope]) {
        field.addEventListener('input', () => { dirty = true; updateControls(); });
    }
    analysisToggle.addEventListener('click', () => requestAction(state?.enabled ? 'pause' : 'start'));
    analysisSave.addEventListener('click', () => requestAction('save'));
    analysisTest.addEventListener('click', () => requestAction('test'));

    function requestActions() {
        send({ request: 'GetActions', id: 'nika-chat-actions' });
    }

    function discoverAction() {
        if (!subscribed) return;
        if (!actionId) {
            problem = 'В Streamer.bot не найден Action «' + ACTION + '».';
            updateControls();
            return;
        }
        setStatus('Подключено к Streamer.bot', 'ready');
        if (!state && !problem.startsWith('Обновите C#')) requestAction('state');
    }

    function connect() {
        const connectionSocket = new WebSocket(WS_URL);
        socket = connectionSocket;
        let actionsReceived = false;
        const handshake = setTimeout(() => connectionSocket.close(), SUBSCRIBE_TIMEOUT);

        connectionSocket.addEventListener('open', () => {
            send({ request: 'Subscribe', id: 'nika-chat-subscribe', events: { general: ['Custom'] } });
            requestActions();
        });

        connectionSocket.addEventListener('message', event => {
            let packet;
            try { packet = JSON.parse(event.data); } catch { return; }
            if (!packet || typeof packet !== 'object') return;
            if (packet.id === 'nika-chat-subscribe') {
                subscribed = packet.status === 'ok';
                if (!subscribed) { connectionSocket.close(); return; }
            } else if (packet.id === 'nika-chat-actions') {
                actionsReceived = true;
                const actions = Array.isArray(packet.actions) ? packet.actions : [];
                actionId = actions.find(action => action.name === ACTION && action.enabled !== false)?.id || '';
            } else if (packet.id && packet.id === pendingTest?.id && packet.status === 'error') {
                finishTest({ error: 'Streamer.bot отклонил запуск теста.' });
                return;
            } else if (packet.id && packet.id === pendingCommand?.id && packet.status === 'error') {
                clearTimeout(pendingCommand.timer);
                pendingCommand = null;
                problem = 'Streamer.bot отклонил команду анализа.';
                updateControls();
                return;
            } else {
                if (packet.event?.source === 'General' && packet.event?.type === 'Custom') {
                    let data = packet.data?.data;
                    if (typeof data === 'string') {
                        try { data = JSON.parse(data); } catch { return; }
                    }
                    receiveCustom(data);
                } else if (typeof packet.event === 'string') receiveCustom(packet);
                return;
            }
            if (subscribed && actionsReceived) {
                clearTimeout(handshake);
                discoverAction();
            }
        });

        connectionSocket.addEventListener('close', () => {
            clearTimeout(handshake);
            subscribed = false;
            actionId = '';
            state = null;
            clearTimeout(pendingCommand?.timer);
            pendingCommand = null;
            if (pendingTest) finishTest({ error: 'Связь со Streamer.bot потеряна во время теста.' });
            problem = 'Ожидаем переподключения к Streamer.bot…';
            setStatus('Связь со Streamer.bot потеряна', 'error');
            updateControls();
            setTimeout(connect, RETRY_DELAY);
        });
    }

    setInterval(() => {
        if (socket?.readyState === WebSocket.OPEN && subscribed && !actionId) requestActions();
    }, 5000);
    connect();
</script>
</body>
</html>
