<script>
(()=>{
  const nav=performance.getEntriesByType?performance.getEntriesByType('navigation')[0]:null;
  const reload=nav?nav.type==='reload':!!(performance.navigation&&performance.navigation.type===1);
  if(!reload)return;
  try{if('scrollRestoration' in history)history.scrollRestoration='manual';if(location.hash)history.replaceState(history.state,'',location.pathname+location.search)}catch{}
  document.documentElement.classList.add('reload-top');
  let cancelled=false;
  const cancel=()=>{cancelled=true;document.documentElement.classList.remove('reload-top')};
  for(const event of ['touchstart','pointerdown','wheel','keydown'])window.addEventListener(event,cancel,{once:true,passive:true});
  const top=()=>{if(!cancelled){const active=document.activeElement;if(active&&active!==document.body&&typeof active.blur==='function')active.blur();window.scrollTo(0,0)}};
  window.addEventListener('load',top,{once:true});
  window.addEventListener('pageshow',event=>{if(event.persisted){cancel();return}top();requestAnimationFrame(()=>{top();requestAnimationFrame(()=>{top();cancel();try{if('scrollRestoration' in history)history.scrollRestoration='auto'}catch{}})})},{once:true});
})();
</script>
